name: Publish to crates.io

# Tag-driven release. Pushing a version tag `vX.Y.Z` (cut by release.yml on merge) runs this
# workflow, which cuts a GitHub Release for the tag.
#
# crates.io publish is GUARDED OFF (dig_ecosystem#2647). dig-gossip carries ONE vendored fork in
# [patch.crates-io] — `native-tls`, patched so the OpenSSL server acceptor sets CERT_REQUIRED plus
# Chia CA trust for inbound mTLS (CON-009); upstream `TlsAcceptorBuilder` offers no way to require a
# client certificate. `cargo publish` STRIPS [patch.crates-io] from the published metadata, so a
# published dig-gossip would build against upstream `native-tls`, compile cleanly, and silently
# accept inbound peers presenting no client certificate at all. That is a silent security
# regression, not a build break — which is exactly why the guard is a workflow step and not a
# reliance on the compiler.
# The guard is therefore UNCONDITIONAL: neither a tag push nor a manual `workflow_dispatch`
# publishes. Dispatch is not a sanctioned escape hatch — the blocker is structural, and anyone with
# dispatch permission could otherwise ship a dig-gossip that accepts uncertificated peers. A tag push
# still cuts the GitHub Release. Re-enable publishing only once dig_ecosystem#2647 removes the need
# for the `native-tls` patch.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # crates.io publish. GUARDED OFF ENTIRELY (dig_ecosystem#2647): NO event publishes, because
  # `cargo publish` strips the [patch.crates-io] `native-tls` fork and the published crate would then
  # accept inbound peers with no client certificate — see the header note. The job stays present and
  # always FAILs (exit 1) so the `create-release` job below can `needs: publish` with `if: always()`
  # and still cut a GitHub Release on every tag.
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Fail crates.io publish on every event (dig_ecosystem#2647)
        run: |
          echo "Cannot publish to crates.io: dig-gossip carries one [patch.crates-io] vendored fork,"
          echo "native-tls, whose OpenSSL server acceptor sets CERT_REQUIRED plus Chia CA trust for"
          echo "inbound mTLS (CON-009). Upstream TlsAcceptorBuilder cannot require a client"
          echo "certificate at all."
          echo ""
          echo "cargo publish STRIPS [patch.crates-io] from the published metadata, so a published"
          echo "dig-gossip would build against upstream native-tls, compile cleanly, and silently"
          echo "accept inbound peers presenting no client certificate. The failure mode is a silent"
          echo "security regression, not a build error."
          echo ""
          echo "Manual dispatch does NOT make this safe; the publish blocker is structural, so this"
          echo "guard refuses EVERY event. The native-tls patch must be removable first"
          echo "(dig_ecosystem#2647)."
          echo ""
          echo "The git + Cargo.lock consumer path (dig-node) is unaffected."
          exit 1

      - name: Checkout code
        if: false # unreachable: the guard above fails the job on every event (dig_ecosystem#2647)
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: false # unreachable: the guard above fails the job on every event (dig_ecosystem#2647)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        if: false # unreachable: the guard above fails the job on every event (dig_ecosystem#2647)
        uses: Swatinem/rust-cache@v2

      # `--locked` (not `--allow-dirty`): verify against the committed Cargo.lock so deps resolve to
      # their pinned revisions instead of re-resolving bare-git deps to a drifted `main` tip.
      - name: Verify package can be built
        if: false # unreachable: the guard above fails the job on every event (dig_ecosystem#2647)
        run: cargo build --release --locked

      - name: Verify package can be packaged
        if: false # unreachable: the guard above fails the job on every event (dig_ecosystem#2647)
        run: cargo package --locked

      - name: Check if CARGO_REGISTRY_TOKEN is available
        if: false # unreachable: the guard above fails the job on every event (dig_ecosystem#2647)
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not set in repository settings"
            exit 1
          fi

      - name: Publish to crates.io
        if: false # unreachable: the guard above fails the job on every event (dig_ecosystem#2647)
        run: cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "dig-gossip v${{ steps.extract_version.outputs.VERSION }}"
          body: |
            ## dig-gossip v${{ steps.extract_version.outputs.VERSION }}

            DIG Network P2P gossip — peer discovery, connection management, and message routing with Plumtree, ERLAY, priority lanes, compact blocks, Dandelion++, and relay fallback.

            ### Installation
            ```toml
            [dependencies]
            dig-gossip = "${{ steps.extract_version.outputs.VERSION }}"
            ```

            See the [README](https://github.com/DIG-Network/dig-gossip/blob/main/README.md) for usage instructions.
          draft: false
          prerelease: false
