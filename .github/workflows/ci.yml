name: CI

# Continuous integration for every push to `main` and every pull request.
#
# This is the day-to-day quality gate (the `publish.yml` workflow only fires on
# `v*` tags). It enforces formatting, lints, docs, the test suite, AND a
# **line-coverage floor of 80%** measured with `cargo llvm-cov`. A change that
# drops line coverage below 80% fails the build.
#
# Flaky-test management (#489): the test suite runs under `cargo nextest` with
# `--retries 2` so a test that fails then passes on retry is reported as FLAKY
# (surfaced in the run output / JUnit) rather than silently green or blocking
# the merge on transient flakiness. Coverage instrumentation still runs via
# `cargo llvm-cov nextest` so the 80% floor is measured the same way.
#
# `--no-fail-fast` (dig_ecosystem#2228) is what makes the numbers this job prints
# TOTALS rather than floors. Without it nextest stops at the first failing target,
# and the run reports a pass count that reads exactly like a complete one: a red
# head here stopped at 531 of 977, so 446 tests never executed AND the 80% line
# floor below was never measured at all — the job failed for the one broken test
# while silently declining to answer the coverage question it exists to answer.
# "Unmeasured" and "measured and under" are different verdicts and must not look
# alike. The job still fails on any real failure; it just finishes counting first.
#
# Coverage notes:
# - Measured against the production-shaped **default** feature set
#   (`native-tls,relay,erlay,compact-blocks,dandelion`). The `tor` and `rustls`
#   features are opt-in and pull heavy / alternate-TLS dependencies, so they are
#   not part of the coverage gate (their cfg-gated code is excluded from the
#   default-feature report rather than counted as "uncovered").
# - `vendor/` (the patched `native-tls` crate — the only remaining fork) is
#   excluded via `--ignore-filename-regex` — we only gate on our own `src/`.
# - Integration tests bind loopback TLS listeners; they run single-threaded
#   (`--test-threads=1`) to match `publish.yml` and avoid port/handshake races.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: Format, Clippy & Docs
    # `--all-features` is INVALID here (dig_ecosystem#2756): `native-tls` and `rustls` are
    # alternative TLS backends, never a pair — enabling both used to compile silently into a
    # split-brain configuration (outbound dials over native-tls, inbound accepts over rustls,
    # picked by two DIFFERENT call sites that disagree) and now hits the crate-level
    # `compile_error!` in `src/lib.rs` instead. So clippy/doc run as TWO legs, one per backend,
    # each carrying every OTHER feature (`relay`, `erlay`, `compact-blocks`, `dandelion`, `tor`)
    # so lint coverage of non-TLS code is unchanged from the single `--all-features` invocation
    # this replaces — only the TLS backend selection is now exclusive per leg.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check clippy (native-tls leg)
        run: >-
          cargo clippy --all-targets
          --no-default-features
          --features native-tls,relay,erlay,compact-blocks,dandelion,tor
          -- -D warnings

      - name: Check clippy (rustls leg)
        # `--lib` only, NOT `--all-targets` (dig_ecosystem#2756): at least two integration test
        # files (`int_015_tests`, `con_001_tests`) import `create_native_tls_connector`
        # unconditionally with no `#[cfg(feature = "native-tls")]` guard, and neither is declared
        # with `required-features = ["native-tls"]` in Cargo.toml -- so `--all-targets` under a
        # genuine rustls-only feature set tries to compile them and fails. This is a real,
        # pre-existing gap independent of this fix (masked before because the OLD
        # `--all-features` invocation always had native-tls on too) -- tracked separately rather
        # than fixed here; see the `rustls-tests` job above, which uses the same `--lib`-only
        # scoping for the identical reason.
        run: >-
          cargo clippy --lib
          --no-default-features
          --features rustls,relay,erlay,compact-blocks,dandelion,tor
          -- -D warnings

      - name: Check documentation (native-tls leg)
        run: >-
          cargo doc --no-deps
          --no-default-features
          --features native-tls,relay,erlay,compact-blocks,dandelion,tor

      - name: Check documentation (rustls leg)
        run: >-
          cargo doc --no-deps
          --no-default-features
          --features rustls,relay,erlay,compact-blocks,dandelion,tor

  lock:
    name: Cargo.lock in sync
    # The version-drift guard (#1885). A PR that bumps Cargo.toml without re-locking leaves the
    # lock's own entry for this crate behind, and `--locked` then fails for everyone — CI, a
    # contributor on a clean checkout, and every consumer that resolves dig-gossip by git rev
    # (this crate is git-dep'd, not on crates.io, so its lock is what consumers resolve against).
    # `cargo metadata --locked` fails whenever the lock is not already a valid solution for the
    # manifests, which is exactly that drift — and it needs no build, so it reports in seconds.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Verify Cargo.lock matches Cargo.toml
        run: cargo metadata --locked --format-version 1 > /dev/null

  rustls-tests:
    name: rustls inbound tests (Linux, #1371)
    # The coverage job above measures the native-tls default feature set; the rustls inbound
    # acceptor (#1371) is cfg-gated out of it. This job runs the rustls-feature test suite on Linux
    # so the OpenSSL/Linux inbound cert-capture regression test actually executes on every PR.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run rustls-feature library tests
        # `--lib` only: the integration-test binaries under `tests/` (con_001/con_002/…) are
        # `required-features = ["native-tls"]` and are covered by the native-tls coverage job. The
        # rustls inbound acceptor's regression test (#1371) lives in `src/connection/rustls_inbound.rs`
        # and runs here so the OpenSSL/Linux cert-capture path is exercised on every PR.
        run: >-
          cargo test
          --locked
          --no-default-features
          --features rustls,relay,erlay,compact-blocks,dandelion
          --lib
          --no-fail-fast
          --
          --test-threads=1

  coverage:
    name: Test Suite + Coverage (>=80%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests with coverage and enforce >=80% line coverage
        run: >-
          cargo llvm-cov nextest
          --locked
          --no-default-features
          --features native-tls,relay,erlay,compact-blocks,dandelion
          --ignore-filename-regex 'vendor/'
          --fail-under-lines 80
          --lcov --output-path lcov.info
          --no-fail-fast
          --test-threads=1
          --retries 2

      - name: Coverage summary
        if: always()
        run: >-
          cargo llvm-cov report
          --ignore-filename-regex 'vendor/'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov.info
          path: lcov.info
          if-no-files-found: ignore
